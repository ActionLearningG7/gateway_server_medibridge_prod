name: Build and Deploy API Gateway

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "main" ]

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/medibridge-api-gateway

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
            ${{ env.DOCKER_IMAGE }}:${{ github.ref_name }}

      - name: Run Docker container with env variables
        run: |
          docker run -d \
            --name medibridge-api-gateway \
            -p 8080:8080 \
            -e SPRING_PROFILES_ACTIVE="${{ secrets.SPRING_PROFILE }}" \
            -e EUREKA_URL="${{ secrets.EUREKA_URL }}" \
            -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            -e REDIS_HOST="${{ secrets.REDIS_HOST }}" \
            -e REDIS_PORT="${{ secrets.REDIS_PORT }}" \
            -e REDIS_PASSWORD="${{ secrets.REDIS_PASSWORD }}" \
            -e CORS_ORIGINS="${{ secrets.CORS_ORIGINS }}" \
            -e SERVER_PORT="8080" \
            --restart unless-stopped \
            ${{ env.DOCKER_IMAGE }}:latest
