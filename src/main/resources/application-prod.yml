spring:
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**
        - id: appointment-service
          uri: lb://appointment-service
          predicates:
            - Path=/api/v1/appointments/**
        - id: prescription-service
          uri: lb://prescription-service
          predicates:
            - Path=/api/v1/prescriptions/**
        - id: lab-service
          uri: lb://lab-service
          predicates:
            - Path=/api/v1/labs/**
        - id: reports-service
          uri: lb://reports-service
          predicates:
            - Path=/api/v1/reports/**
        - id: sos-ambulance-service
          uri: lb://sos-ambulance-service
          predicates:
            - Path=/api/v1/sos/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: ${CORS_ORIGINS}
            allowed-methods: "*"
            allowed-headers: "*"
            allow-credentials: true

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    root: WARN
    org.springframework.cloud.gateway: INFO
  file:
    name: /var/log/medibridge/api-gateway.log
