spring:
  # Redis Configuration
  data:
    redis:
      url: ${REDIS_URL:redis://default:GOwUPRpFGRVtZMSiEEWlTapCvefmpsFj@hopper.proxy.rlwy.net:11415}

  cloud:
    gateway:
      # ===== WEBSOCKET CONFIGURATION =====
      # WebSocket connections require special handling to preserve upgrade headers
      # CORS is handled by gateway globalcors - RemoveResponseHeader filters strip CORS from microservices
      default-filters:
        - PreserveHostHeader  # Critical for WebSocket handshake
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE


      routes:
        # ===== WEBSOCKET ROUTE - LAB SERVICE =====
        # Supports: http://localhost:8080/ws-lab/info
        - id: websocket-lab
          uri: lb://lab-service
          predicates:
            - Path=/ws-lab/**
          filters:
            - PreserveHostHeader
          metadata:
            connect-timeout: 60000
            response-timeout: 3600000
            id_timeout: 3600000

        # ===== WEBSOCKET ROUTE - DIRECT PATH (MUST be first for proper matching) =====
        # Supports: http://localhost:8080/ws/info (SockJS handshake)
        # Routes to: http://appointment-service:8082/api/v1/ws/info (via context-path)
        - id: websocket-stomp-direct
          uri: lb://appointment-service
          predicates:
            - Path=/ws/**
          filters:
            - PrefixPath=/api/v1
          metadata:
            connect-timeout: 60000
            response-timeout: 3600000
            id_timeout: 3600000

        # ===== WEBSOCKET ROUTE - API PATH (for /api/ws routing) =====
        # Supports: http://localhost:8080/api/ws/info
        # Routes to: http://appointment-service:8082/api/v1/ws/info
        - id: websocket-stomp-api-short
          uri: lb://appointment-service
          predicates:
            - Path=/api/ws/**
          filters:
            - PreserveHostHeader
            - RewritePath=/api/ws/(?<segment>.*), /api/v1/ws/${segment}
          metadata:
            connect-timeout: 60000
            response-timeout: 3600000
            id_timeout: 3600000

        # ===== WEBSOCKET ROUTE - FULL API PATH (for explicit /api/v1/ws routing) =====
        # Supports: http://localhost:8080/api/v1/ws/info (when explicitly called)
        - id: websocket-stomp-api
          uri: lb://appointment-service
          predicates:
            - Path=/api/v1/ws/**
          filters:
            # NO rewrite needed - appointment service has context-path /api/v1
            - PreserveHostHeader
          metadata:
            connect-timeout: 60000
            response-timeout: 3600000
            id_timeout: 3600000


        # User Service - Organization Configuration
        - id: user-service-organization
          uri: lb://user-service
          predicates:
            - Path=/api/v1/organization/**
          filters:
            - StripPrefix=0

        # User Service - Authentication
        - id: user-service-auth
          uri: lb://user-service
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripPrefix=0

        # ===== IMPORTANT: Appointment Service specific routes MUST come BEFORE generic /doctors routes =====

        # Appointment Service - Doctor Queues (SPECIFIC - must be before /api/v1/doctors/**)
        - id: appointment-service-doctor-queues
          uri: lb://appointment-service
          predicates:
            - Path=/api/v1/doctors/queues/**
          filters:
            - StripPrefix=0

        # Appointment Service - Doctor Consultations (SPECIFIC - must be before /api/v1/doctors/**)
        - id: appointment-service-doctor-consultations
          uri: lb://appointment-service
          predicates:
            - Path=/api/v1/doctors/consultations/**
          filters:
            - StripPrefix=0

        # Appointment Service - Patient Consultations (SPECIFIC - must be before /api/v1/patients/**)
        - id: appointment-service-patient-consultations
          uri: lb://appointment-service
          predicates:
            - Path=/api/v1/patients/consultations/**
          filters:
            - StripPrefix=0

        # Appointment Service - Main
        - id: appointment-service
          uri: lb://appointment-service
          predicates:
            - Path=/api/v1/appointments/**
          filters:
            - StripPrefix=0

        # Appointment Service - Queues
        - id: appointment-service-queues
          uri: lb://appointment-service
          predicates:
            - Path=/api/v1/queues/**
          filters:
            - StripPrefix=0

        # Appointment Service - Video Sessions
        - id: appointment-service-video
          uri: lb://appointment-service
          predicates:
            - Path=/api/v1/video-sessions/**
          filters:
            - StripPrefix=0

        # ===== IMPORTANT: Lab Service specific routes MUST come BEFORE generic routes =====

        # Lab Service - Doctor Lab Orders (MUST be before user-service-doctors)
        - id: lab-service-doctor-orders
          uri: lb://lab-service
          predicates:
            - Path=/api/v1/doctors/lab-orders/**
          filters:
            - StripPrefix=0

        # Lab Service - Admin Lab Tasks (MUST be before user-service-admin)
        - id: lab-service-admin-tasks
          uri: lb://lab-service
          predicates:
            - Path=/api/v1/admin/lab/tasks/**
          filters:
            - StripPrefix=0

        # Lab Service - Admin Lab Orders (MUST be before user-service-admin)
        - id: lab-service-admin-orders
          uri: lb://lab-service
          predicates:
            - Path=/api/v1/admin/lab/orders/**
          filters:
            - StripPrefix=0

        # Lab Service - Lab Tests Catalog
        - id: lab-service-tests
          uri: lb://lab-service
          predicates:
            - Path=/api/v1/lab-tests/**
          filters:
            - StripPrefix=0

        # Lab Service - Patient Lab Orders
        - id: lab-service-patient-orders
          uri: lb://lab-service
          predicates:
            - Path=/api/v1/lab-orders/**
          filters:
            - StripPrefix=0

        # Lab Service - Phlebotomist Tasks
        - id: lab-service-phlebotomist-tasks
          uri: lb://lab-service
          predicates:
            - Path=/api/v1/phlebotomy/**
          filters:
            - StripPrefix=0

        # Lab Service - Phlebotomist Admin (Result Upload)
        - id: lab-service-phlebotomist-admin
          uri: lb://lab-service
          predicates:
            - Path=/api/v1/phlebotomy-admin/**
          filters:
            - StripPrefix=0

        # Lab Service - Legacy /labs endpoint
        - id: lab-service
          uri: lb://lab-service
          predicates:
            - Path=/api/v1/labs/**
          filters:
            - StripPrefix=0

        # ===== User Service routes (GENERIC - must come AFTER specific routes) =====

        # User Service - Patients
        - id: user-service-patients
          uri: lb://user-service
          predicates:
            - Path=/api/v1/patients/**
          filters:
            - StripPrefix=0

        # User Service - Doctors (GENERIC - must come AFTER lab-service-doctor-orders)
        - id: user-service-doctors
          uri: lb://user-service
          predicates:
            - Path=/api/v1/doctors/**
          filters:
            - StripPrefix=0

        # User Service - Admin (GENERIC - must come AFTER lab-service-admin-tasks)
        - id: user-service-admin
          uri: lb://user-service
          predicates:
            - Path=/api/v1/admin/**
          filters:
            - StripPrefix=0

        # Prescription Service
        - id: prescription-service
          uri: lb://prescription-service
          predicates:
            - Path=/api/v1/prescriptions/**
          filters:
            - StripPrefix=0

        # Reports Service
        - id: reports-service
          uri: lb://reports-service
          predicates:
            - Path=/api/v1/reports/**
          filters:
            - StripPrefix=0

        # SOS Ambulance Service
        - id: sos-ambulance-service
          uri: lb://sos-ambulance-service
          predicates:
            - Path=/api/v1/sos/**
          filters:
            - StripPrefix=0

      # ===== CENTRALIZED CORS CONFIGURATION =====
      # Gateway is the SINGLE source of CORS headers
      # Services MUST NOT set their own CORS headers
      globalcors:
        # Add CORS headers to ALL responses
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            # Specific allowed origin ONLY - no wildcards
            allowedOrigins:
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - "*"
            exposedHeaders:
              - "Authorization"
              - "Content-Type"
              - "Accept"
              - "Origin"
              - "X-Requested-With"
              - "Cache-Control"
              - "pragma"
              - "expires"
            allowCredentials: true
            maxAge: 3600

jwt:
  secret: ${JWT_SECRET:MediBridge2026!Pr0duct1on$ecretK3y#H0sp1talManag3m3ntSyst3m@Secur1ty}

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
    com.medibridge: DEBUG


